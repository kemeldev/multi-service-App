name: oidc whoami (temporary)

on:
  push:
    branches: ["lab4/oidc"]

permissions:
  contents: read
  id-token: write

jobs:
  whoami:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Request a token and print its claims (never the token itself)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d | jq '{iss, aud, sub, repository, ref, event_name, exp}'

      - name: Try to assume the push role from a feature branch
        id: assume
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Report
        env:
          OUTCOME: ${{ steps.assume.outcome }}
        run: |
          echo "assume-role outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "UNEXPECTED: a feature branch was trusted. Check the trust policy sub condition."
            exit 1
          fi
          echo "EXPECTED: the trust policy rejected a non-main branch."
