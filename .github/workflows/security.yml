name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "REPLACE_ME"
  TRIVY_VERSION: "0.75.0"
  ACTIONLINT_VERSION: "REPLACE_ME"
  ZIZMOR_VERSION: "REPLACE_ME"

jobs:
  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks and verify checksum
        run: |
          V="$GITLEAKS_VERSION"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -sSLO "${base}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSLO "${base}/gitleaks_${V}_checksums.txt"
          grep "gitleaks_${V}_linux_x64.tar.gz" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks

      - name: Scan every commit
        run: ./gitleaks git --verbose --redact --exit-code 1 .

  workflows:
    name: workflow lint and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: actionlint (correctness)
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            "rhysd/actionlint:${ACTIONLINT_VERSION}" -color

      - name: zizmor (security)
        run: |
          pipx run "zizmor==${ZIZMOR_VERSION}" .github/workflows/

  dockerfiles:
    name: dockerfile misconfiguration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: trivy config
        run: |
          docker run --rm -v "$PWD:/src:ro" "aquasec/trivy:${TRIVY_VERSION}" \
            config --severity HIGH,CRITICAL --exit-code 1 /src

  security-ok:
    name: security-ok
    if: always()
    needs: [secrets, workflows, dockerfiles]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any security job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              exit 1
            fi
          done