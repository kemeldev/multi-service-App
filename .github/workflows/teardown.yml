name: teardown
on:
  workflow_dispatch:
permissions: {}
jobs:
  scale-to-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300e6ec4b3c7b3f34b9b65ce2d2d8
        with:
          aws-access-key-id: ${{ secrets.LAB4_TEARDOWN_KEY_ID }}
          aws-secret-access-key: ${{ secrets.LAB4_TEARDOWN_SECRET }}
          aws-region: us-east-1
      - name: Scale all services to zero
        run: |
          for svc in frontend python node; do
            aws ecs update-service --cluster msa-prod --service "$svc" --desired-count 0
          done
      - name: Stop RDS
        run: |
          aws rds stop-db-instance --db-instance-identifier msa-prod-pg || \
            echo "already stopped or not available"
