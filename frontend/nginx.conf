server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
# Do not advertise the nginx version.
    server_tokens off;
location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
# Runtime configuration must never be cached.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
# Hashed build assets are immutable and can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
location / {
        try_files $uri $uri/ /index.html;
    }
}
