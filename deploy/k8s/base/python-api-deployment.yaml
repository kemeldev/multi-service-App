apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-api
  labels:
    app: python-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-api
  template:
    metadata:
      labels:
        app: python-api
    spec:
      automountServiceAccountToken: false     # this service never calls the Kubernetes API
      securityContext:                        # Pod level: applies to ALL containers, including the init container
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      # Runs to completion BEFORE the main container starts.
      # Replaces Compose's: depends_on: { condition: service_healthy }
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres-db:5432 ..."
              until pg_isready -h postgres-db -p 5432 -q; do
                echo "  not ready, retrying in 2s"
                sleep 2
              done
              echo "postgres-db is accepting connections"
          securityContext:
            runAsUser: 70                     # the 'postgres' user in this image
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: python-api
          image: python-api:0.1.0
          imagePullPolicy: IfNotPresent      # required: image is kind-loaded, not in a registry
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          ports:
            - name: http
              containerPort: 8001            # <-- CHANGE to your app's real port
          envFrom:
            - configMapRef:
                name: python-api-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username              # same key as Postgres, different env var name
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /health                  # <-- CHANGE if different
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 192Mi                  # about 2x the request; no CPU limit on purpose
          securityContext:
            runAsUser: 100                   # the 'app' user (UID 100) from docker inspect
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]