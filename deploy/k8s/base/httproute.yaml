apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: msa-route
  namespace: multi-service-app
spec:
  parentRefs:
    - name: traefik-gateway        # <-- VERIFY with: kubectl get gateway -n traefik
      namespace: traefik
      kind: Gateway
  rules:
    # ---- /api/py -> python-api, prefix stripped ----
    - matches:
        - path:
            type: PathPrefix
            value: /api/py
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: python-api
          port: 80
    # ---- /api/node -> node-api, prefix stripped ----
    - matches:
        - path:
            type: PathPrefix
            value: /api/node
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: node-api
          port: 80
    # ---- everything else -> react-frontend, path untouched ----
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: react-frontend
          port: 80
