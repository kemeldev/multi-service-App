apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
rules:
  # Update and watch Deployments (rollout restart, set image, rollout status)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  # rollout status reads ReplicaSets to follow the rollout
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  # See Pods, for diagnostics
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Run and clean up migration Jobs (Sub-lab 3.7 Step 8)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-binding
subjects:
  - kind: ServiceAccount
    name: deployer-sa
    namespace: multi-service-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
